<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Master Chief: Covenant Rush</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        margin: 0;
        background: radial-gradient(circle at top, #1b243f, #06070d 68%);
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      #wrapper {
        text-align: center;
      }

      h1 {
        margin: 0 0 0.45rem;
        letter-spacing: 0.06em;
        color: #b7f97c;
      }

      p {
        margin: 0.2rem 0;
        opacity: 0.9;
      }

      canvas {
        border: 2px solid #85ff6f;
        background: #010205;
        box-shadow: 0 0 24px #5d8c31;
      }
    </style>
  </head>
  <body>
    <div id="wrapper">
      <h1>Master Chief: Covenant Rush</h1>
      <p>Move: WASD / Arrow keys • Shoot: Space • Stop the alien wave</p>
      <p>Survive as long as possible and stack your score.</p>
      <canvas id="game" width="900" height="520" aria-label="halo style shooter game"></canvas>
    </div>

    <script>
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');

      const state = {
        keys: {},
        bullets: [],
        enemies: [],
        stars: Array.from({ length: 110 }, () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          speed: 24 + Math.random() * 42,
          size: Math.random() * 2 + 1,
        })),
        score: 0,
        gameOver: false,
        spawnTimer: 0,
        wave: 1,
      };

      const player = {
        x: 120,
        y: canvas.height / 2,
        width: 44,
        height: 70,
        speed: 300,
        cooldown: 0,
        facing: 1,
      };

      const plasmaPalette = ['#4ee5ff', '#9aff6e', '#f2cc61'];

      function createEnemy() {
        const kindRoll = Math.random();
        const grunt = {
          type: 'grunt',
          width: 40,
          height: 52,
          speed: 95 + Math.random() * 65,
          hp: 1,
          color: '#7c9bff',
          score: 10,
        };

        const elite = {
          type: 'elite',
          width: 52,
          height: 70,
          speed: 78 + Math.random() * 55,
          hp: 2,
          color: '#d977ff',
          score: 20,
        };

        const spec = kindRoll > 0.75 ? elite : grunt;
        return {
          ...spec,
          x: canvas.width + spec.width,
          y: spec.height / 2 + Math.random() * (canvas.height - spec.height),
          wiggle: Math.random() * Math.PI * 2,
        };
      }

      function keyDown(e) {
        state.keys[e.key.toLowerCase()] = true;
      }

      function keyUp(e) {
        state.keys[e.key.toLowerCase()] = false;
      }

      window.addEventListener('keydown', keyDown);
      window.addEventListener('keyup', keyUp);

      function shoot() {
        if (player.cooldown > 0 || state.gameOver) return;
        state.bullets.push({
          x: player.x + player.width * 0.8,
          y: player.y - 10,
          radius: 4,
          speed: 520,
          color: plasmaPalette[Math.floor(Math.random() * plasmaPalette.length)],
          width: 15,
          height: 6,
        });
        player.cooldown = 0.14;
      }

      function intersects(a, b) {
        return (
          a.x < b.x + b.width &&
          a.x + a.width > b.x &&
          a.y < b.y + b.height &&
          a.y + a.height > b.y
        );
      }

      function playerBounds() {
        return {
          x: player.x,
          y: player.y - player.height / 2,
          width: player.width,
          height: player.height,
        };
      }

      function update(dt) {
        if (state.gameOver) {
          if (state.keys['enter']) reset();
          return;
        }

        const left = state.keys['a'] || state.keys['arrowleft'];
        const right = state.keys['d'] || state.keys['arrowright'];
        const up = state.keys['w'] || state.keys['arrowup'];
        const down = state.keys['s'] || state.keys['arrowdown'];

        if (left) {
          player.x -= player.speed * dt;
          player.facing = -1;
        }
        if (right) {
          player.x += player.speed * dt;
          player.facing = 1;
        }
        if (up) player.y -= player.speed * dt;
        if (down) player.y += player.speed * dt;
        if (state.keys[' ']) shoot();

        player.x = Math.max(20, Math.min(canvas.width * 0.65, player.x));
        player.y = Math.max(player.height / 2, Math.min(canvas.height - player.height / 2, player.y));

        player.cooldown = Math.max(0, player.cooldown - dt);

        state.wave = 1 + Math.floor(state.score / 140);
        state.spawnTimer -= dt;
        if (state.spawnTimer <= 0) {
          state.enemies.push(createEnemy());
          const waveFactor = Math.max(0.28, 0.68 - state.wave * 0.03);
          state.spawnTimer = waveFactor + Math.random() * 0.4;
        }

        state.stars.forEach((star) => {
          star.x -= star.speed * dt;
          if (star.x < -5) {
            star.x = canvas.width + 5;
            star.y = Math.random() * canvas.height;
          }
        });

        state.bullets.forEach((bullet) => {
          bullet.x += bullet.speed * dt;
        });
        state.bullets = state.bullets.filter((b) => b.x - b.radius < canvas.width + 20);

        state.enemies.forEach((enemy) => {
          enemy.x -= (enemy.speed + state.wave * 8) * dt;
          enemy.wiggle += dt * 2.8;
          enemy.y += Math.sin(enemy.wiggle) * 24 * dt;
        });

        const pRect = playerBounds();
        for (let i = state.enemies.length - 1; i >= 0; i -= 1) {
          const e = state.enemies[i];
          const enemyRect = {
            x: e.x - e.width / 2,
            y: e.y - e.height / 2,
            width: e.width,
            height: e.height,
          };

          if (intersects(enemyRect, pRect) || e.x + e.width < 0) {
            state.gameOver = true;
            break;
          }

          for (let j = state.bullets.length - 1; j >= 0; j -= 1) {
            const b = state.bullets[j];
            if (
              b.x + b.radius > enemyRect.x &&
              b.x - b.radius < enemyRect.x + enemyRect.width &&
              b.y + b.radius > enemyRect.y &&
              b.y - b.radius < enemyRect.y + enemyRect.height
            ) {
              state.bullets.splice(j, 1);
              e.hp -= 1;
              if (e.hp <= 0) {
                state.score += e.score;
                state.enemies.splice(i, 1);
              }
              break;
            }
          }
        }
      }

      function drawChief() {
        const x = player.x;
        const y = player.y;

        ctx.save();
        if (player.facing < 0) {
          ctx.translate(x + player.width / 2, 0);
          ctx.scale(-1, 1);
          ctx.translate(-(x + player.width / 2), 0);
        }

        ctx.fillStyle = '#5a8f3d';
        ctx.fillRect(x + 9, y - 23, 26, 42);

        ctx.fillStyle = '#2f3f28';
        ctx.fillRect(x + 6, y - 2, 8, 24);
        ctx.fillRect(x + 30, y - 2, 8, 24);

        ctx.fillStyle = '#4f7f39';
        ctx.fillRect(x + 12, y + 20, 8, 20);
        ctx.fillRect(x + 24, y + 20, 8, 20);

        ctx.fillStyle = '#4a7a35';
        ctx.fillRect(x + 12, y - 36, 20, 14);

        ctx.fillStyle = '#6ed0ef';
        ctx.fillRect(x + 15, y - 33, 14, 8);

        ctx.fillStyle = '#111820';
        ctx.fillRect(x + 32, y - 10, 18, 8);
        ctx.fillRect(x + 48, y - 7, 12, 4);

        ctx.restore();
      }

      function drawEnemy(enemy) {
        const x = enemy.x;
        const y = enemy.y;

        ctx.fillStyle = enemy.color;
        ctx.fillRect(x - enemy.width / 2 + 8, y - enemy.height / 2 + 14, enemy.width - 16, enemy.height - 18);

        ctx.fillStyle = '#142034';
        ctx.fillRect(x - 10, y - enemy.height / 2 + 7, 20, 12);

        ctx.fillStyle = '#87efff';
        ctx.fillRect(x - 8, y - enemy.height / 2 + 10, 16, 6);

        ctx.fillStyle = enemy.type === 'elite' ? '#ff5ec9' : '#5cff6f';
        ctx.fillRect(x - enemy.width / 2 + 2, y - 3, 10, 6);
      }

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        state.stars.forEach((star) => {
          ctx.fillStyle = '#b6d3ff';
          ctx.globalAlpha = 0.45 + (star.size / 3) * 0.55;
          ctx.fillRect(star.x, star.y, star.size, star.size);
        });
        ctx.globalAlpha = 1;

        drawChief();
        state.enemies.forEach(drawEnemy);

        state.bullets.forEach((bullet) => {
          ctx.fillStyle = bullet.color;
          ctx.beginPath();
          ctx.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#ffffff';
          ctx.globalAlpha = 0.55;
          ctx.fillRect(bullet.x - 2, bullet.y - 1, bullet.width, bullet.height / 2);
          ctx.globalAlpha = 1;
        });

        ctx.fillStyle = '#fff';
        ctx.font = '22px Arial';
        ctx.fillText(`Score: ${state.score}`, 16, 30);
        ctx.fillText(`Wave: ${state.wave}`, 16, 58);

        if (state.gameOver) {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.62)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          ctx.textAlign = 'center';
          ctx.fillStyle = '#b7f97c';
          ctx.font = '44px Arial';
          ctx.fillText('Mission Failed', canvas.width / 2, canvas.height / 2 - 34);

          ctx.fillStyle = '#fff';
          ctx.font = '25px Arial';
          ctx.fillText(`Final Score: ${state.score}`, canvas.width / 2, canvas.height / 2 + 10);
          ctx.font = '20px Arial';
          ctx.fillText('Press Enter to rejoin the fight', canvas.width / 2, canvas.height / 2 + 45);
          ctx.textAlign = 'start';
        }
      }

      function reset() {
        player.x = 120;
        player.y = canvas.height / 2;
        player.cooldown = 0;
        player.facing = 1;

        state.bullets = [];
        state.enemies = [];
        state.score = 0;
        state.wave = 1;
        state.gameOver = false;
        state.spawnTimer = 0.65;
      }

      let lastTime = performance.now();
      function loop(now) {
        const dt = Math.min((now - lastTime) / 1000, 0.033);
        lastTime = now;
        update(dt);
        render();
        requestAnimationFrame(loop);
      }

      reset();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
