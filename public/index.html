<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Fighter</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        margin: 0;
        background: radial-gradient(circle at top, #191b33, #080912 65%);
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      #wrapper {
        text-align: center;
      }

      h1 {
        margin: 0 0 0.5rem;
        letter-spacing: 0.06em;
      }

      p {
        margin-top: 0;
        opacity: 0.85;
      }

      canvas {
        border: 2px solid #6aa6ff;
        background: #02030a;
        box-shadow: 0 0 20px #2f4d8a;
      }
    </style>
  </head>
  <body>
    <div id="wrapper">
      <h1>Space Fighter</h1>
      <p>Move: WASD / Arrow keys • Shoot: Space • Survive & destroy ships</p>
      <canvas id="game" width="800" height="500" aria-label="space shooter game"></canvas>
    </div>

    <script>
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');

      const state = {
        keys: {},
        bullets: [],
        enemies: [],
        stars: Array.from({ length: 100 }, () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          speed: 20 + Math.random() * 40,
          size: Math.random() * 2 + 1,
        })),
        score: 0,
        gameOver: false,
        spawnTimer: 0,
      };

      const player = {
        x: 100,
        y: canvas.height / 2,
        width: 34,
        height: 24,
        speed: 260,
        cooldown: 0,
      };

      function createEnemy() {
        const size = 20 + Math.random() * 18;
        return {
          x: canvas.width + size,
          y: size + Math.random() * (canvas.height - size * 2),
          width: size,
          height: size * 0.7,
          speed: 70 + Math.random() * 120,
          wiggle: Math.random() * Math.PI * 2,
        };
      }

      function keyDown(e) {
        state.keys[e.key.toLowerCase()] = true;
      }

      function keyUp(e) {
        state.keys[e.key.toLowerCase()] = false;
      }

      window.addEventListener('keydown', keyDown);
      window.addEventListener('keyup', keyUp);

      function shoot() {
        if (player.cooldown > 0 || state.gameOver) return;
        state.bullets.push({
          x: player.x + player.width,
          y: player.y,
          radius: 3,
          speed: 460,
        });
        player.cooldown = 0.18;
      }

      function intersects(a, b) {
        return (
          a.x < b.x + b.width &&
          a.x + a.width > b.x &&
          a.y < b.y + b.height &&
          a.y + a.height > b.y
        );
      }

      function update(dt) {
        if (state.gameOver) {
          if (state.keys['enter']) reset();
          return;
        }

        const left = state.keys['a'] || state.keys['arrowleft'];
        const right = state.keys['d'] || state.keys['arrowright'];
        const up = state.keys['w'] || state.keys['arrowup'];
        const down = state.keys['s'] || state.keys['arrowdown'];

        if (left) player.x -= player.speed * dt;
        if (right) player.x += player.speed * dt;
        if (up) player.y -= player.speed * dt;
        if (down) player.y += player.speed * dt;
        if (state.keys[' ']) shoot();

        player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
        player.y = Math.max(player.height / 2, Math.min(canvas.height - player.height / 2, player.y));

        player.cooldown = Math.max(0, player.cooldown - dt);

        state.spawnTimer -= dt;
        if (state.spawnTimer <= 0) {
          state.enemies.push(createEnemy());
          state.spawnTimer = 0.55 + Math.random() * 0.8;
        }

        state.stars.forEach((star) => {
          star.x -= star.speed * dt;
          if (star.x < -5) {
            star.x = canvas.width + 5;
            star.y = Math.random() * canvas.height;
          }
        });

        state.bullets.forEach((bullet) => {
          bullet.x += bullet.speed * dt;
        });
        state.bullets = state.bullets.filter((b) => b.x - b.radius < canvas.width + 10);

        state.enemies.forEach((enemy) => {
          enemy.x -= enemy.speed * dt;
          enemy.wiggle += dt * 3;
          enemy.y += Math.sin(enemy.wiggle) * 30 * dt;
        });

        for (let i = state.enemies.length - 1; i >= 0; i -= 1) {
          const e = state.enemies[i];
          const enemyRect = { x: e.x, y: e.y - e.height / 2, width: e.width, height: e.height };
          const playerRect = {
            x: player.x,
            y: player.y - player.height / 2,
            width: player.width,
            height: player.height,
          };

          if (intersects(enemyRect, playerRect) || e.x + e.width < 0) {
            state.gameOver = true;
            break;
          }

          for (let j = state.bullets.length - 1; j >= 0; j -= 1) {
            const b = state.bullets[j];
            if (
              b.x + b.radius > e.x &&
              b.x - b.radius < e.x + e.width &&
              b.y + b.radius > e.y - e.height / 2 &&
              b.y - b.radius < e.y + e.height / 2
            ) {
              state.bullets.splice(j, 1);
              state.enemies.splice(i, 1);
              state.score += 10;
              break;
            }
          }
        }
      }

      function drawShip(x, y, width, height, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x - width, y - height / 2);
        ctx.lineTo(x - width * 0.8, y);
        ctx.lineTo(x - width, y + height / 2);
        ctx.closePath();
        ctx.fill();
      }

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        state.stars.forEach((star) => {
          ctx.fillStyle = '#9fc8ff';
          ctx.globalAlpha = 0.4 + (star.size / 3) * 0.6;
          ctx.fillRect(star.x, star.y, star.size, star.size);
        });
        ctx.globalAlpha = 1;

        drawShip(player.x + player.width, player.y, player.width, player.height, '#6ab5ff');

        state.enemies.forEach((enemy) => {
          drawShip(enemy.x, enemy.y, enemy.width, enemy.height, '#ff6a88');
        });

        ctx.fillStyle = '#ffe066';
        state.bullets.forEach((bullet) => {
          ctx.beginPath();
          ctx.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2);
          ctx.fill();
        });

        ctx.fillStyle = '#fff';
        ctx.font = '20px Arial';
        ctx.fillText(`Score: ${state.score}`, 15, 30);

        if (state.gameOver) {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#fff';
          ctx.textAlign = 'center';
          ctx.font = '40px Arial';
          ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 20);
          ctx.font = '22px Arial';
          ctx.fillText(`Final Score: ${state.score}`, canvas.width / 2, canvas.height / 2 + 20);
          ctx.font = '18px Arial';
          ctx.fillText('Press Enter to restart', canvas.width / 2, canvas.height / 2 + 55);
          ctx.textAlign = 'start';
        }
      }

      function reset() {
        player.x = 100;
        player.y = canvas.height / 2;
        player.cooldown = 0;
        state.bullets = [];
        state.enemies = [];
        state.score = 0;
        state.gameOver = false;
        state.spawnTimer = 0.6;
      }

      let lastTime = performance.now();
      function loop(now) {
        const dt = Math.min((now - lastTime) / 1000, 0.033);
        lastTime = now;
        update(dt);
        render();
        requestAnimationFrame(loop);
      }

      reset();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
